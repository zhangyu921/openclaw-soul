<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
  <defs>
    <linearGradient id="openclaw-soul-brand" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" class="grad-from" />
      <stop offset="50%" class="grad-via" />
      <stop offset="100%" class="grad-to" />
    </linearGradient>
    <style>
      /* Aligns with `globals.css` light / dark --primary + --accent */
      .grad-from { stop-color: rgb(230 0 35 / 0.8); }
      .grad-via { stop-color: rgb(230 0 35 / 0.6); }
      .grad-to { stop-color: rgb(255 240 240 / 0.8); }
      .stroke-ring { stroke: rgb(230 0 35 / 0.3); }
      .dot-fill { fill: rgb(255 255 255 / 0.95); }
      @media (prefers-color-scheme: dark) {
        .grad-from { stop-color: rgb(255 55 81 / 0.8); }
        .grad-via { stop-color: rgb(255 55 81 / 0.6); }
        .grad-to { stop-color: rgb(61 26 31 / 0.85); }
        .stroke-ring { stroke: rgb(255 55 81 / 0.35); }
        .dot-fill { fill: rgb(18 18 18 / 0.95); }
      }
    </style>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#openclaw-soul-brand)" class="stroke-ring" stroke-width="1" />
  <circle cx="16" cy="16" r="4.75" class="dot-fill" />
</svg>
