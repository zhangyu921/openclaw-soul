name: Release CLI

on:
  push:
    branches:
      - main

# pnpm version comes from root package.json "packageManager" (single source of truth).
# npm Trusted Publishing (OIDC): configure on npmjs.com for @openclaw-soul/cli — workflow file name must match exactly: release.yml

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC for npm Trusted Publishing (no long-lived NPM_TOKEN)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Trusted publishing requires Node >= 22.14.0 (npm docs)
          node-version: "22.14"
          cache: pnpm

      # Trusted publishing requires npm CLI >= 11.5.1 (npm docs); Node 22.14 may ship older npm.
      - name: Use npm 11+ (OIDC trusted publishing)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1.7.0
        with:
          publish: pnpm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag cli-v* (match published @openclaw-soul/cli version)
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "cli-v${VERSION}" --force
          git push origin "refs/tags/cli-v${VERSION}"
