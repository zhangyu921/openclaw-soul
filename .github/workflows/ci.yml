name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: AGENTS.md line budget (max 100)
        run: |
          lines=$(wc -l < AGENTS.md | tr -d ' ')
          if [ "$lines" -gt 100 ]; then
            echo "::error::AGENTS.md has ${lines} lines; maximum is 100. Move detail to docs/REPOSITORY-CONTEXT.md or docs/DEVELOPMENT.md."
            exit 1
          fi
          echo "AGENTS.md: ${lines} lines (ok)"

      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter @openclaw-soul/web exec playwright install --with-deps chromium
      - run: pnpm e2e:smoke
